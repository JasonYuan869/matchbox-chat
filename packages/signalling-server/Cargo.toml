[package]
name = "signalling-server"
version = "0.1.0"
edition = "2024"
authors = ["Jason Yuan <jason.yuan869@gmail.com>"]

[dependencies]
anyhow = "1.0.98"
config = "0.15.11"
dotenvy = "0.15.7"
futures = "0.3.31"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["default", "json", "std", "env-filter"] }
